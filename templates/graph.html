<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缅甸地缘风险分析 - 关系图谱</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=views-v3">
    <script src="{{ url_for('static', filename='vendor/echarts/echarts.min.js') }}"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">缅甸地缘风险智能分析系统</div>
        <ul class="nav-links">
            <li><a href="/">对话分析</a></li>
            <li><a href="/dashboard">综合态势</a></li>
            <li><a href="/map">风险地图</a></li>
            <li><a href="/trend">趋势预测</a></li>
            <li><a href="/graph" class="active">关系图谱</a></li>
            <li id="alert-indicator" style="margin-left:auto;padding-right:16px;"></li>
        </ul>
    </nav>

    <main class="container console-page">
        <h2>关系网络图谱</h2>
        <p class="subtitle">Knowledge Graph · Entity Co-occurrence · Actor Network</p>

        {% include '_view_filters.html' %}
        <div class="controls">
            <label>视图
                <select id="graph-view">
                    <option value="cooccur">文章实体共现网络（正式观测）</option>
                    <option value="kg">知识图谱种子网络（演示域）</option>
                    <option value="actors">国家行为体网络（8节点·有向）</option>
                </select>
            </label>
            <button class="btn btn-primary" onclick="loadGraph()">刷新</button>
        </div>

        <div class="console-grid">
            <div class="span-12"><div id="graph-chart" style="height:560px;width:100%;"></div></div>

            <div class="card span-8">
                <div class="card-title"><span class="icon">📊</span> 网络统计</div>
                <div id="graph-stats"></div>
            </div>
            <div class="card span-4">
                <div class="card-title"><span class="icon">🧭</span> 关键节点 / 社区</div>
                <div id="graph-top"></div>
            </div>
            <div class="span-12">
                <div class="card">
                    <div class="card-title"><span class="icon">⚠️</span> 语义边界（必读）</div>
                    <div id="graph-semantics"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/graph.js') }}"></script>
</body>
</html>
