<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关系图谱 · 缅甸地缘风险智能分析系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=mist-2">
    <script src="{{ url_for('static', filename='vendor/echarts/echarts.min.js') }}"></script>
<link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg"></head>
<body>
    {% include '_nav.html' %}

    <main class="container console-page">
        <header class="page-hero">
            <div class="hero-text">
                <p class="eyebrow">Relation Network</p>
                <h1>关系网络图谱</h1>
                <p class="lede">文章实体共现、知识图谱种子与八个国家行为体之间的有向关系；拖拽节点、滚轮缩放即可探索。</p>
            </div>
        </header>

        <div class="filter-bar">
            {% include '_view_filters.html' %}
            <div class="controls filter-extra">
                <label>视图
                    <select id="graph-view">
                        <option value="cooccur">文章实体共现网络（正式观测）</option>
                        <option value="kg">知识图谱种子网络（演示域）</option>
                        <option value="actors">国家行为体网络（8节点·有向）</option>
                    </select>
                </label>
                <button class="btn btn-primary" onclick="loadGraph()">刷新</button>
            </div>
        </div>

        <div class="console-grid">
            <section class="card chart-card span-8">
                <div id="graph-chart"></div>
            </section>

            <aside class="card span-4">
                <h3>网络解读</h3>
                <div id="graph-stats"></div>
                <h4>关键节点与社区</h4>
                <div id="graph-top"></div>
                <details open>
                    <summary>语义边界（必读）</summary>
                    <div id="graph-semantics" class="diag-text"></div>
                </details>
            </aside>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/common.js') }}?v=mist-2"></script>
    <script src="{{ url_for('static', filename='js/graph.js') }}?v=mist-2"></script>
</body>
</html>
