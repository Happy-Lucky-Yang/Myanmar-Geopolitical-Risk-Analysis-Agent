<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缅甸地缘风险分析 - 趋势预测</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=views-v3">
    <script src="{{ url_for('static', filename='vendor/echarts/echarts.min.js') }}"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">缅甸地缘风险智能分析系统</div>
        <ul class="nav-links">
            <li><a href="/">对话分析</a></li>
            <li><a href="/dashboard">综合态势</a></li>
            <li><a href="/map">风险地图</a></li>
            <li><a href="/trend" class="active">趋势预测</a></li>
            <li id="alert-indicator" style="margin-left:auto;padding-right:16px;"></li>
        </ul>
    </nav>

    <main class="container console-page">
        <h2>风险趋势分析</h2>
        <p class="subtitle">Risk Trend · Forecast · Anomaly Detection</p>

        {% include '_view_filters.html' %}
        <div class="controls">
            <label>数据域 <select id="domain-filter"><option value="observed">正式观测</option><option value="legacy">旧版历史（不预测）</option></select></label>
            <button class="btn btn-primary" onclick="loadTrend()">刷新</button>
        </div>

        <div class="console-grid">
            <!-- 摘要卡片 -->
            <div class="span-12"><div class="summary-cards" id="summary-cards"></div></div>

            <!-- ECharts 图表 -->
            <div class="span-12"><div id="trend-chart"></div></div>

            <!-- 预测信息 -->
            <div class="card span-6">
                <div class="card-title"><span class="icon">📈</span> 短期预测 (7天)</div>
                <div id="forecast-area"></div>
            </div>

            <!-- 异常事件 -->
            <div class="card span-6">
                <div class="card-title"><span class="icon">⚡</span> 异常事件检测</div>
                <div id="anomaly-area"></div>
            </div>

            <!-- 报告导出 -->
            <div class="span-12" style="text-align:center;margin-top:0.5rem;">
                <a data-report-format="html" aria-disabled="true" target="_blank" rel="noopener" class="btn btn-primary" style="text-decoration:none;margin-right:8px;">导出 HTML 报告</a>
                <a data-report-format="docx" aria-disabled="true" target="_blank" rel="noopener" class="btn btn-primary" style="text-decoration:none;">导出 DOCX 报告</a>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/common.js') }}?v=views-v3"></script>
    <script src="{{ url_for('static', filename='js/trend.js') }}?v=views-v3"></script>
</body>
</html>
