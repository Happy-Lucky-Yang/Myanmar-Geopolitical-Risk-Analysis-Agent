<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>趋势预测 · 缅甸地缘风险智能分析系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=shell-2">
    <script src="{{ url_for('static', filename='vendor/echarts/echarts.min.js') }}"></script>
<link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg"></head>
<body>
    {% include '_nav.html' %}

    <main class="container console-page">
        <header class="page-hero">
            <div class="hero-text">
                <p class="eyebrow">Risk Trend</p>
                <h1>风险趋势与短期外推</h1>
                <p class="lede">连续日历窗口内的风险变化、异常点与探索性预测。缺测日留空，不用旧值或零值补齐。</p>
            </div>
            <div class="hero-actions">
                <details class="more-actions"><summary>更多操作</summary><span class="export-group">导出报告
                    <a data-report-format="html" aria-disabled="true" target="_blank" rel="noopener">HTML</a>
                    <a data-report-format="docx" aria-disabled="true" target="_blank" rel="noopener">DOCX</a>
                </span></details>
            </div>
        </header>

        <details class="research-filter"><summary>高级筛选（时间、地区、来源与数据域）</summary>
            {% include '_view_filters.html' %}
            <div class="controls filter-extra">
                <label>数据域 <select id="domain-filter"><option value="observed">正式观测</option><option value="legacy">旧版历史（不预测）</option></select></label>
                <button class="btn btn-secondary" onclick="loadTrend()">读取所选窗口</button>
            </div>
        </details>

        <div class="console-grid">
            <div class="span-12"><div class="summary-cards" id="summary-cards"></div></div>

            <section class="card chart-card span-12">
                <div id="trend-chart"></div>
            </section>

            <section class="card span-7">
                <h3>短期预测（7 天）</h3>
                <div id="forecast-area"></div>
            </section>

            <section class="card span-5">
                <h3>异常点检测</h3>
                <div id="anomaly-area"></div>
            </section>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/common.js') }}?v=shell-2"></script>
    <script src="{{ url_for('static', filename='js/trend.js') }}?v=shell-1"></script>
</body>
</html>
