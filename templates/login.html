<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>课题组登录 · 缅甸地缘风险智能分析系统</title>
<link rel="stylesheet" href="/static/css/style.css?v=mist-2"><link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg"></head>
<body>
<main class="login-page">
<section class="card login-card">
<p class="eyebrow">Geo-Risk Atlas</p>
<h1>课题组登录</h1>
<p class="lede">手工输入默认仅本人可见；共享需由本人主动确认。</p>
<form id="login-form">
<label>用户名 <input id="username" autocomplete="username" required maxlength="128"></label>
<label>密码 <input id="password" type="password" autocomplete="current-password" required maxlength="512"></label>
<button type="submit" class="btn btn-primary">登录</button>
</form>
<p id="status" role="status"></p>
</section>
</main>
<script src="/static/js/common.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async function (event) {
    event.preventDefault();
    var status = document.getElementById('status');
    status.textContent = '登录中…';
    try {
        var result = await fetchJSON('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: document.getElementById('username').value, password: document.getElementById('password').value})});
        if (result.success) location.href = '/dashboard';
        else status.textContent = result.error || '登录失败';
    } catch (error) { status.textContent = error.message; }
});
</script>
</body></html>
