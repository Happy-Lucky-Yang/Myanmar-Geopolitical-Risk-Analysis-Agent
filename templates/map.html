<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缅甸地缘风险分析 - 风险地图</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">缅甸地缘风险智能分析系统</div>
        <ul class="nav-links">
            <li><a href="/">对话分析</a></li>
            <li><a href="/dashboard">综合态势</a></li>
            <li><a href="/map" class="active">风险地图</a></li>
            <li><a href="/trend">趋势预测</a></li>
        </ul>
    </nav>

    <main class="container map-page">
        <h2>缅甸风险地图</h2>

        <div class="controls">
            <label>查看最近
                <select id="days-select">
                    <option value="7">7天</option>
                    <option value="14">14天</option>
                    <option value="30" selected>30天</option>
                    <option value="90">90天</option>
                </select>
                数据
            </label>
            <button type="button" class="btn btn-primary" onclick="loadMap()">刷新地图</button>
        </div>

        <div class="map-wrap">
            <div id="map-container">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p class="loading-text">加载地图中...</p>
                </div>
            </div>

            <!-- 自定义图层面板 -->
            <div id="layer-panel" class="layer-panel" style="display:none">
                <div class="lp-title">🗂️ 图层面板</div>
                <div class="lp-group">省级风险风格（二选一）</div>
                <label class="lp-item"><input type="radio" name="risk-style" value="hybrid" checked> 圆点+光晕</label>
                <label class="lp-item"><input type="radio" name="risk-style" value="choropleth"> 分级填色</label>
                <label class="lp-item"><input type="radio" name="risk-style" value="none"> 关闭</label>
                <div class="lp-group">叠加图层</div>
                <label class="lp-item"><input type="checkbox" id="lyr-kde"> 事件密度 (KDE)</label>
                <div class="lp-item lp-slider">密度透明度
                    <input type="range" id="kde-opacity" min="20" max="100" value="60">
                </div>
                <label class="lp-item"><input type="checkbox" id="lyr-borders" checked> 省界（悬停高亮）</label>
                <label class="lp-item"><input type="checkbox" id="lyr-country" checked> 国界</label>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script>
        async function loadMap() {
            var days = document.getElementById('days-select').value;
            var container = document.getElementById('map-container');
            renderLoading(container);

            try {
                var resp = await fetch('/api/map/unified?days=' + encodeURIComponent(days));
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                var html = await resp.text();

                // 安全检查：确保返回的是有效 HTML
                if (!html || html.length < 50) {
                    throw new Error('地图数据为空');
                }
                container.innerHTML = html;
                bindLayerPanel();
            } catch (e) {
                container.innerHTML = '<div class="error-card">'
                    + '<div class="error-icon">🗺️</div>'
                    + '<div class="error-msg">' + escapeHtml('地图加载失败: ' + e.message) + '</div>'
                    + '<button class="btn btn-secondary" style="margin-top:1rem" onclick="loadMap()">重试</button>'
                    + '</div>';
            }
        }

        /* 图层面板绑定：依赖地图内注入的 window._mmMap / window._mmLayers。
           地图包在 iframe(srcdoc) 内异步加载，轮询等待注册就绪后再绑定 */
        function bindLayerPanel() {
            var tries = 0;
            var timer = setInterval(function () {
                tries++;
                if (window._mmLayers && window._mmMap) {
                    clearInterval(timer);
                    doPanelBind();
                } else if (tries > 50) {  // 10 秒超时：隐藏面板
                    clearInterval(timer);
                    document.getElementById('layer-panel').style.display = 'none';
                }
            }, 200);
        }

        function doPanelBind() {
            var panel = document.getElementById('layer-panel');
            var layers = window._mmLayers;
            var map = window._mmMap;
            if (!layers || !map) { panel.style.display = 'none'; return; }
            panel.style.display = 'block';

            function setOn(layer, on) {
                if (!layer) return;
                if (on) { layer.addTo(map); } else { map.removeLayer(layer); }
            }

            // 风险风格互斥组
            function applyStyle(v) {
                setOn(layers.hybrid, v === 'hybrid');
                setOn(layers.choropleth, v === 'choropleth');
            }
            document.querySelectorAll('input[name="risk-style"]').forEach(function (r) {
                r.onchange = function () { applyStyle(this.value); };
            });
            var checked = document.querySelector('input[name="risk-style"]:checked');
            applyStyle(checked ? checked.value : 'hybrid');

            // 事件密度层（累积库未就绪时禁用）
            var kdeBox = document.getElementById('lyr-kde');
            var kdeSlider = document.getElementById('kde-opacity');
            if (!layers.kde) {
                kdeBox.checked = false;
                kdeBox.disabled = true;
                kdeBox.title = '事件累积库暂无数据';
                kdeSlider.disabled = true;
            }
            kdeBox.onchange = function () { setOn(layers.kde, this.checked); };
            kdeSlider.oninput = function () {
                if (layers.kde && typeof layers.kde.setOpacity === 'function') {
                    layers.kde.setOpacity(this.value / 100);
                }
            };

            // 省界/国界开关
            document.getElementById('lyr-borders').onchange = function () {
                setOn(layers.borders, this.checked);
            };
            document.getElementById('lyr-country').onchange = function () {
                setOn(layers.country, this.checked);
            };
        }

        // 页面加载时自动加载
        loadMap();
    </script>
</body>
</html>
