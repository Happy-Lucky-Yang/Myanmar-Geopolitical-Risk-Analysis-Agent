<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缅甸地缘风险分析 - 风险地图</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">缅甸地缘风险智能分析系统</div>
        <ul class="nav-links">
            <li><a href="/">对话分析</a></li>
            <li><a href="/dashboard">综合态势</a></li>
            <li><a href="/map" class="active">风险地图</a></li>
            <li><a href="/trend">趋势预测</a></li>
        </ul>
    </nav>

    <main class="container">
        <h2>缅甸风险地图</h2>
        <p class="subtitle">省级风险分级填色图 / 事件密度核密度分析（KDE），悬停或点击查看详情</p>

        <div class="controls">
            <label>地图类型
                <select id="map-mode">
                    <option value="risk" selected>省级风险分级填色</option>
                    <option value="events">事件密度 (KDE)</option>
                </select>
            </label>
            <label>查看最近
                <select id="days-select">
                    <option value="7">7天</option>
                    <option value="14">14天</option>
                    <option value="30" selected>30天</option>
                </select>
                数据
            </label>
            <button type="button" class="btn btn-primary" onclick="loadMap()">刷新地图</button>
        </div>

        <div class="info-banner">
            ⚠️ 省级风险图为真实省界分级填色（6 档色阶，点击省份查看详情），无历史数据时为简化模拟值；事件密度图基于 GDELT 事件定位的加权核密度估计（GADM 4.1 边界裁剪），首次生成需数分钟
        </div>

        <div id="map-container">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p class="loading-text">加载地图中...</p>
            </div>
        </div>

        <div style="margin-top:0.75rem;font-size:0.78rem;color:var(--text-muted)">
            数据来源: 系统历史风险评分 + GDELT 事件数据 + GADM 4.1 行政边界 | 地图引擎: Folium (Leaflet)
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script>
        async function loadMap() {
            var days = document.getElementById('days-select').value;
            var mode = document.getElementById('map-mode').value;
            var container = document.getElementById('map-container');
            renderLoading(container);

            var url = mode === 'events'
                ? '/api/map/events?days=' + encodeURIComponent(days)
                : '/api/map?days=' + encodeURIComponent(days);

            try {
                var resp = await fetch(url);
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                var html = await resp.text();

                // 安全检查：确保返回的是有效 HTML
                if (!html || html.length < 50) {
                    throw new Error('地图数据为空');
                }
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = '<div class="error-card">'
                    + '<div class="error-icon">🗺️</div>'
                    + '<div class="error-msg">' + escapeHtml('地图加载失败: ' + e.message) + '</div>'
                    + '<button class="btn btn-secondary" style="margin-top:1rem" onclick="loadMap()">重试</button>'
                    + '</div>';
            }
        }

        // 页面加载时自动加载
        loadMap();
    </script>
</body>
</html>
