<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>风险地图 · 缅甸地缘风险智能分析系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=shell-2">
<link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg"></head>
<body>
    {% include '_nav.html' %}

    <main class="map-page">
        <!-- 组导航在左，查询和图层在主区工具面板，避免双侧栏。 -->
        <header class="page-hero"><div class="hero-text"><h1>缅甸风险地图</h1><p class="lede">省级事件烈度、报道事件密度与行政边界叠加展示；灰色为无有效观测。</p></div></header>
        <details class="map-toolbar"><summary>地图工具（查询、图层与导出）</summary>
        <div class="map-tool-grid">
            <div class="sidebar-section">
                <span class="sidebar-label">查询范围</span>
                {% include '_view_filters.html' %}
                <button type="button" class="btn btn-primary sidebar-btn" onclick="loadMap()">刷新地图</button>
                <p id="map-query-status" class="muted-note" aria-live="polite"></p>
            </div>

            <div class="sidebar-section" id="layer-panel">
                <div class="lp-title">图层</div>
                <div class="lp-group">风险呈现</div>
                <label class="lp-item"><input type="radio" name="risk-style" value="hybrid" checked> 风险散点</label>
                <label class="lp-item"><input type="radio" name="risk-style" value="choropleth"> 区域填色</label>
                <label class="lp-item"><input type="radio" name="risk-style" value="none"> 不渲染</label>

                <div class="lp-group">叠加</div>
                <label class="lp-item"><input type="checkbox" id="lyr-kde"> 报道事件密度 KDE</label>
                <div class="lp-item lp-slider">透明度
                    <input type="range" id="kde-opacity" min="20" max="100" value="60">
                </div>
                <label class="lp-item"><input type="checkbox" id="lyr-borders" checked> 省级行政界</label>
                <label class="lp-item"><input type="checkbox" id="lyr-country" checked> 国界</label>
            </div>

        </div>
            <span class="export-group">导出报告
                <a data-report-format="html" aria-disabled="true" target="_blank" rel="noopener">当前筛选 HTML</a>
            </span>
        </details>
        <p class="muted-note">省级事件规则烈度不等同于全国风险分；密度层基于 GDELT，事件需被媒体报道才会进入，热区反映报道关注度而非实际冲突密度；底图故障不影响本地边界与分析图层。</p>
        <p id="map-visible-status" class="muted-note" aria-live="polite">正在读取所选窗口地图…</p>

        <!-- 地图主区域 -->
        <div class="map-wrap">
            <div id="map-container">
                <div class="loading-spinner">
                    <div class="loader-radar">
                        <div class="sweep"></div>
                        <div class="core"></div>
                    </div>
                    <p class="loading-text">正在加载地理数据…</p>
                </div>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/common.js') }}?v=shell-2"></script>
    <script>
        var mapSequence = 0;
        var layerBindTimer = null;
        var mapController = null;
        async function loadMap() {
            var sequence = ++mapSequence;
            if (mapController) mapController.abort();
            var controller = mapController = new AbortController();
            var timeout = setTimeout(() => controller.abort(), 30000);
            var filters = readViewFilters();
            var container = document.getElementById('map-container');
            var status = document.getElementById('map-query-status');
            var visibleStatus = document.getElementById('map-visible-status');
            clearInterval(layerBindTimer);
            window._mmMap = window._mmLayers = null;
            document.querySelectorAll('#layer-panel input').forEach(el => { el.disabled = true; });
            status.textContent = '正在加载所选窗口，旧图已清除';
            visibleStatus.textContent = status.textContent;
            setViewReport(null);
            renderLoading(container);

            try {
                var expected = sequence === 1 ? new URLSearchParams(location.search).get('revision') : null;
                var resp = await fetch('/api/map/unified?' + viewQuery({revision:expected}, filters), {signal:controller.signal});
                if (sequence !== mapSequence) return;
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                var html = await resp.text();
                if (sequence !== mapSequence) return;

                if (!html || html.length < 50) {
                    throw new Error('地图数据为空');
                }
                container.innerHTML = html;
                bindLayerPanel(sequence);
                var revision = resp.headers.get('X-Data-Revision');
                setViewReport({revision:revision, filters:filters});
                syncViewNavigation(filters);
                window.history.replaceState(null, '', '/map?' + viewQuery({}, filters));
                status.textContent = '截至 ' + filters.end_date + ' · ' + filters.days + '个日历日 · 区域 ' + filters.region
                    + ' · 来源 ' + (filters.source || '全部') + ' · 数据版本 ' + (revision || '未提供');
                visibleStatus.textContent = status.textContent;
            } catch (e) {
                if (sequence !== mapSequence) return;
                status.textContent = '请求失败，当前筛选无可用地图；导出已禁用';
                visibleStatus.textContent = status.textContent;
                container.innerHTML = '<div class="error-card">'
                    + '<div class="error-icon">🗺️</div>'
                    + '<div class="error-msg">' + escapeHtml('地图加载失败: ' + e.message) + '</div>'
                    + '<button class="btn btn-secondary" style="margin-top:1rem" onclick="loadMap()">重试</button>'
                    + '</div>';
            } finally {
                clearTimeout(timeout);
            }
        }

        /* 图层面板绑定：依赖地图内注入的 window._mmMap / window._mmLayers。
           地图包在 iframe(srcdoc) 内异步加载，轮询等待注册就绪后再绑定 */
        function bindLayerPanel(sequence) {
            var tries = 0;
            layerBindTimer = setInterval(function () {
                if (sequence !== mapSequence) { clearInterval(layerBindTimer); return; }
                tries++;
                var frame = document.querySelector('#map-container iframe');
                var target = frame && frame.contentWindow;
                if (target && target._mmLayers && target._mmMap) {
                    window._mmLayers = target._mmLayers;
                    window._mmMap = target._mmMap;
                    clearInterval(layerBindTimer);
                    document.querySelectorAll('#layer-panel input').forEach(el => { el.disabled = false; });
                    doPanelBind();
                } else if (tries > 50) {
                    clearInterval(layerBindTimer);
                    document.getElementById('map-query-status').textContent += '；图层未就绪或当前为无数据底图';
                }
            }, 200);
        }

        function doPanelBind() {
            var layers = window._mmLayers;
            var map = window._mmMap;
            if (!layers || !map) return;

            function setOn(layer, on) {
                if (!layer) return;
                if (on) { layer.addTo(map); } else { map.removeLayer(layer); }
            }

            function applyStyle(v) {
                setOn(layers.hybrid, v === 'hybrid');
                setOn(layers.choropleth, v === 'choropleth');
            }
            document.querySelectorAll('input[name="risk-style"]').forEach(function (r) {
                r.onchange = function () { applyStyle(this.value); };
            });
            var checked = document.querySelector('input[name="risk-style"]:checked');
            applyStyle(checked ? checked.value : 'hybrid');

            var kdeBox = document.getElementById('lyr-kde');
            var kdeSlider = document.getElementById('kde-opacity');
            kdeBox.disabled = kdeSlider.disabled = !layers.kde;
            kdeBox.title = layers.kde ? '所选窗口事件密度' : '所选窗口暂无有效事件密度';
            if (!layers.kde) {
                kdeBox.checked = false;
                kdeBox.disabled = true;
                kdeBox.title = '事件累积库暂无数据';
                kdeSlider.disabled = true;
            }
            kdeBox.onchange = function () { setOn(layers.kde, this.checked); };
            kdeSlider.oninput = function () {
                if (layers.kde && typeof layers.kde.setOpacity === 'function') {
                    layers.kde.setOpacity(this.value / 100);
                }
            };

            kdeSlider.oninput();
            setOn(layers.kde, kdeBox.checked);
            setOn(layers.borders, document.getElementById('lyr-borders').checked);
            setOn(layers.country, document.getElementById('lyr-country').checked);
            document.getElementById('lyr-borders').onchange = function () {
                setOn(layers.borders, this.checked);
            };
            document.getElementById('lyr-country').onchange = function () {
                setOn(layers.country, this.checked);
            };
        }

        initViewFilters(loadMap);
        loadMap();
    </script>
</body>
</html>
