[pytest]
# 一键复跑（见 docs/acceptance.md）：python -m pytest -q
#
# 仅收集项目自身测试目录 tests/；显式排除随项目一起分发的 Python 运行时(py312)
# 与虚拟环境(venv312)。否则 pytest 会递归采集 py312/Lib/idlelib/idle_test 与
# site-packages/numpy 内的第三方测试，触发数十个 collection error，使文档承诺的
# 一键复跑命令失效。此配置不改变任何测试行为，仅限定采集范围。
testpaths = tests
norecursedirs = py312 venv312 .* build dist node_modules __pycache__ {arch}
