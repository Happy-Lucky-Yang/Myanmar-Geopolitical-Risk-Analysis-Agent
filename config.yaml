# ========================================
# 缅甸地缘风险智能分析原型系统 - 配置文件
# ========================================

# ---------- 大模型 API ----------
# ⚠️ 安全规则：此文件被 git 追踪并开源，禁止填入真实密钥！
# 真实密钥请写入项目根目录 .env（已被 .gitignore 拦截），
# 系统会自动用 .env 中的 LLM_API_KEY 等环境变量覆盖以下占位符（见 utils/config.py）
llm:
  # 兼容 OpenAI Chat Completions 格式的服务地址
  base_url: "https://open.bigmodel.cn/api/paas/v4/"
  api_key: "your-api-key-here"
  model_name: "glm-4-flash"
  temperature: 0.3
  max_tokens: 2048
  max_retries: 3
  timeout_seconds: 30
  cache_enabled: true

# ---------- HTTP 代理（境外数据源专用） ----------
# 启动 Clash 后代理地址通常为 http://127.0.0.1:7890；留空 = 直连（境外源大概率失败）。
# 生效范围：GDELT / RSS 境外源 / 英文媒体；缅华网等国内源始终直连。
# 也可用 .env 中的 PROXY 环境变量覆盖。
proxy: "http://127.0.0.1:7890"

# ---------- 爬虫配置 ----------
crawler:
  # 定时抓取间隔（小时）
  interval_hours: 4
  # 请求超时（秒）
  timeout: 15
  # 最大重试次数
  max_retries: 3
  # 重试退避基数（秒），实际延迟 = backoff * 2^attempt
  backoff: 2
  # 列表页最大翻页数
  max_pages: 3
  # 默认 User-Agent
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/125.0"
  # 目标来源
  sources:
    - name: "缅甸缅华网"
      url: "https://www.mhwmm.com/miandianxinwen/"
      enabled: true
      language: "zh"
    - name: "路透社缅甸"
      url: "https://www.reuters.com/world/asia-pacific/myanmar/"
      enabled: false   # 反爬较强，初期先关闭
      language: "en"
    - name: "伊洛瓦底报"
      url: "https://www.irrawaddy.com/news/burma"
      enabled: false   # 已迁移至 myanmar_now_crawler.py
      language: "en"
    - name: "Myanmar Now"
      url: "https://www.myanmar-now.org/en/news"
      enabled: false   # 实测 404：该媒体已停运（2026-07 探测确认），待代理接入后用聚合源替代
      language: "en"

# ---------- GDELT 全球事件数据库 ----------
gdelt:
  enabled: true                      # 是否启用 GDELT 数据源
  api_url: "https://api.gdeltproject.org/api/v2/doc/doc"
  language: "english"                 # 语言过滤（english / chinese / 留空=全部）
  source_country: "BM"                # 来源国家代码（BM=缅甸, 留空=全部）
  timespan_days: 7                    # 默认查询最近多少天
  max_results: 100                    # 每次查询最大返回条数
  max_retries: 3                      # 请求重试次数
  timeout: 30                         # 请求超时（秒）
  backoff: 5                          # 重试退避基数（GDELT 要求每 5 秒一个请求）
  min_interval: 5.5                     # 全局限速：任意两次请求最小间隔（秒，留 0.5s 余量）
  jitter: 2.0                           # 限速/重试叠加的随机抖动上限（秒，避免贴边被拒）
  metrics_cache_seconds: 900            # 指标缓存 TTL（15分钟，与 GDELT 数据更新频率对齐）
  csv_enabled: true                     # CSV 直连通道（不限流，主通道；DOC API 降为备用）
  csv_max_files: 672                    # 每轮最多下载的 15 分钟文件数（≈7 天窗口，单文件仅 ~50KB）
  csv_target_events: 200                # 收集到足够缅甸事件后提前停止（缅甸事件稀疏，需多日窗口）
  use_multi_query: true               # 使用多关键词查询（按语言合并为 OR 组合请求，覆盖面广且省配额）
  # 多关键词查询列表（use_multi_query=true 时使用，支持中英文混合）
  query_keywords:
    - "Myanmar conflict"
    - "Myanmar military ceasefire"
    - "Myanmar refugee crisis"
    - "Myanmar sanctions"
    - "Myanmar China economic"
    - "缅甸 冲突"                   # 中文查询（自动语言检测）
    - "缅甸 制裁"                   # 中文查询
    - "缅甸 难民"                   # 中文查询

# ---------- RSS/Atom 新闻源 ----------
rss_feeds:
  google_news_en:
    name: "Google News 聚合(英文)"
    rss_url: "https://news.google.com/rss/search?q=Myanmar+conflict+OR+ceasefire+OR+sanctions+OR+refugee&hl=en-US&gl=US&ceid=US:en"
    enabled: true    # 需代理；一条 URL 聚合数十家国际媒体
    language: "en"
  google_news_zh:
    name: "Google News 聚合(中文)"
    rss_url: "https://news.google.com/rss/search?q=%E7%BC%85%E7%94%B8&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"
    enabled: true    # 需代理
    language: "zh"
  frontier_myanmar:
    name: "Frontier Myanmar"
    rss_url: "https://www.frontiermyanmar.net/en/feed"
    enabled: true
    language: "en"
  dvb:
    name: "Democratic Voice of Burma"
    rss_url: "https://www.dvb.no/feed"
    enabled: false   # 实测域名 dvb.no.org 不存在且 dvb.no 无可用 RSS，暂时停用
    language: "en"
  diplomat_myanmar:
    name: "The Diplomat (Myanmar)"
    rss_url: "https://thediplomat.com/feed/"
    enabled: false   # 付费墙 + 连接超时（2026-07 实测）
    language: "en"

# ---------- 夜间灯光遥感 ----------
nightlight:
  enabled: true
  # 数据源: worldbank (默认, 免费无需Key)
  source: "worldbank"
  # 缓存有效期 (天)
  cache_days: 7

# ---------- 宏观经济统计 ----------
economic:
  enabled: true
  # World Bank API (免费)
  worldbank_indicators:
    gdp_growth: "NY.GDP.MKTP.KD.ZG"       # GDP 增长率
    gdp_per_capita: "NY.GDP.PCAP.CD"       # 人均 GDP
    inflation: "FP.CPI.TOTL.ZG"            # 通胀率
    trade_pct_gdp: "NE.TRD.GNFS.ZS"        # 贸易占GDP比重
  # 缓存有效期 (天)
  cache_days: 30

# ---------- 数据存储 ----------
storage:
  # 数据根目录：留空=项目内 ./data；可指向项目外私密目录将爬取数据外置。
  # 优先级: 环境变量 DATA_ROOT (写在 .env) > 此处 data_root > 默认 ./data
  # 注: raw/processed/external 子目录会在根目录下自动创建
  data_root: ""
  # 输出格式: csv / json
  format: "json"

# ---------- 冲突关键词（用于文本冲突检测） ----------
conflict_keywords:
  zh:
    - "冲突"
    - "战斗"
    - "空袭"
    - "武装"
    - "交火"
    - "爆炸"
    - "袭击"
    - "制裁"
    - "政变"
    - "难民"
    - "抗议"
    - "暴动"
  en:
    - "conflict"
    - "attack"
    - "airstrike"
    - "armed"
    - "ceasefire"
    - "sanction"
    - "coup"
    - "refugee"
    - "protest"
    - "military"

# ---------- 风险评分权重 ----------
risk_weights:
  conflict_frequency: 0.30    # 冲突频次
  sentiment_avg: 0.25         # 情感均值（负面程度）
  nightlight_change: 0.20     # 夜间灯光变化率 (WB代理)
  refugee_change: 0.15        # 难民变化 (经济推断)
  event_severity: 0.10        # 事件严重程度

# ---------- 趋势分析 ----------
trend:
  # 移动平均窗口（天）
  moving_avg_window: 7
  # 回归分析最少需要数据点数
  min_regression_points: 14

# ---------- 定时调度器 ----------
scheduler:
  enabled: true                        # 是否启用自动定时爬取
  crawl_interval_hours: 4              # 缅华网爬取间隔（小时）
  gdelt_interval_hours: 6              # GDELT 查询间隔（小时）
  analysis_interval_hours: 12          # 分析流水线间隔（小时）

# ---------- Flask 服务 ----------
flask:
  host: "127.0.0.1"
  port: 5000
  debug: false
  cors_origins:
    - "http://127.0.0.1:5000"
    - "http://localhost:5000"

# ---------- Neo4j（可选） ----------
neo4j:
  enabled: false
  uri: "bolt://localhost:7687"
  user: "neo4j"
  password: "your-neo4j-password"
